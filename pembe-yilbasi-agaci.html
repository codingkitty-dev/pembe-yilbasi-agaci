<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pembe ASCII Yılbaşı Ağacı</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05080d;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="screen" role="img"
    aria-label="Kar altında dönen pembe ASCII ağacı, altın ışıklar ve hediyeler">
  </canvas>

  <script type="module">
    const canvas = document.querySelector('#screen');
    const ctx = canvas.getContext('2d');
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const tau = Math.PI * 2;
    const treeHeight = 75;
    const pink = ['#70274f', '#a13b6c', '#c65386', '#eb73a4', '#ffa3c6'];
    const gold = ['#b3813b', '#e8b758', '#ffecaa'];
    const letters = 'x+oOX*';
    const snowColors = ['#40536a', '#788da5', '#bacbdc', '#e7f2ff'];

    let width, height, unit, columnWidth, rowHeight, columns, rows, baseY;
    let depth, marks, colors;
    let turnCos = 1;
    let turnSin = 0;
    let seed = 92434;
    let start = performance.now();
    let lastFrame = -Infinity;

    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    function ease(value) {
      const t = Math.max(0, Math.min(1, value));
      return t * t * (3 - 2 * t);
    }

    function treeRadius(y, angle) {
      const level = y / treeHeight;
      const tier = 1 - .15 * ((level * 7) % 1);
      const branch = 1 + .09 * Math.sin(angle * 9 + level * 27);
      return Math.max(.8, 32 * (1 - level) ** .91 * tier * branch);
    }

    // Dalları çevresi olan bir ağacın yüzeyine yerleştir.
    const branches = [];

    for (let y = .35; y < treeHeight; y += .42) {
      const count = Math.max(14, Math.ceil(treeRadius(y, 0) * 13));

      for (let i = 0; i < count; i++) {
        const angle = (i + random()) / count * tau;
        const radius = treeRadius(y, angle) * (.83 + random() * .21);

        branches.push({
          x: Math.cos(angle) * radius,
          y,
          z: Math.sin(angle) * radius,
          angle,
          shade: random(),
          mark: letters[Math.floor(random() * letters.length)]
        });
      }
    }

    const flakes = Array.from({ length: 390 }, () => ({
      x: random(),
      y: random(),
      speed: .025 + random() * .09,
      phase: random() * tau,
      shade: Math.floor(random() * snowColors.length)
    }));

    const ornaments = Array.from({ length: 25 }, (_, i) => ({
      y: 8 + random() * 58,
      angle: i * 2.39996,
      size: 1.3 + random() * 1.3,
      gold: i % 3 === 0
    }));

    const gifts = [
      { angle: .2, radius: 30, size: 8, height: 8, wrap: '#d32f52', ribbon: '#ffe092' },
      { angle: 1.5, radius: 28, size: 10, height: 9, wrap: '#c12649', ribbon: '#ffebcb' },
      { angle: 2.7, radius: 31, size: 8, height: 10, wrap: '#5267dc', ribbon: '#e9c058' },
      { angle: 3.7, radius: 28, size: 8, height: 8, wrap: '#31906b', ribbon: '#f784a3' },
      { angle: 5.1, radius: 30, size: 8, height: 6, wrap: '#ae5737', ribbon: '#ffe092' }
    ];

    function resize() {
      width = Math.max(1, canvas.clientWidth);
      height = Math.max(1, canvas.clientHeight);
      const ratio = Math.min(devicePixelRatio || 1, 2);

      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

      unit = Math.min(width / 96, height / 111);
      baseY = (height + unit * 65) / 2;
      const font = Math.max(1, Math.min(unit * .91, 13));

      ctx.font = `bold ${font}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      columnWidth = Math.max(ctx.measureText('M').width, font * .66);
      rowHeight = font * 1.08;
      columns = Math.ceil(width / columnWidth);
      rows = Math.ceil(height / rowHeight);

      depth = new Float32Array(columns * rows);
      marks = new Array(columns * rows);
      colors = new Array(columns * rows);
      lastFrame = -Infinity;
    }

    function put(x, y, z, mark, color) {
      const col = Math.floor(x / columnWidth);
      const row = Math.floor(y / rowHeight);
      if (col < 0 || row < 0 || col >= columns || row >= rows) return;

      const index = row * columns + col;
      if (z < depth[index]) return;

      depth[index] = z;
      marks[index] = mark;
      colors[index] = color;
    }

    function project(x, y, z, mark, color) {
      const side = x * turnCos - z * turnSin;
      const front = x * turnSin + z * turnCos;
      const scale = 1 + front * .004;

      put(
        width / 2 + side * scale * unit,
        baseY - (y * scale - front * .25) * unit,
        front, mark, color
      );
    }

    function drawSnow(time) {
      for (const flake of flakes) {
        const x = flake.x * width + Math.sin(time + flake.phase) * unit;
        const y = ((flake.y + time * flake.speed) % 1) * height;
        const near = flake.shade === 3 && flake.phase < .8;

        put(x, y, near ? 70 : -100, flake.shade >= 2 ? '+' : '.', snowColors[flake.shade]);
      }
    }

    function drawGround() {
      for (let z = -36; z <= 39; z += 3) {
        for (let x = -41; x <= 41; x += 2) {
          if ((x / 41) ** 2 + (z / 40) ** 2 > 1) continue;
          if (Math.sin(x * 8.2 + z * 5.1) < -.24) continue;

          put(width / 2 + x * unit, baseY + (2 + z * .25) * unit, z, '.', '#293548');
        }
      }
    }

    function drawTree(time, rotation) {
      const grown = treeHeight * ease((time - .65) / 5.05);

      for (const point of branches) {
        if (point.y > grown) break;

        const light = (1 + Math.sin(point.angle + rotation + .7)) / 2;
        const shade = Math.min(4, Math.floor(light * 2.7 + point.shade * 2));
        const edge = grown < treeHeight && grown - point.y < 1.9;

        project(
          point.x, point.y, point.z,
          edge ? '*' : point.mark,
          edge ? '#ffdfeb' : pink[shade]
        );
      }
    }

    function drawLights(time) {
      const end = Math.floor(1100 * ease((time - 5.7) / 3.2));

      for (let i = 0; i < end; i++) {
        const progress = i / 1099;
        const angle = progress * tau * 5.4;
        const centerY = 6 + progress * 62;
        const shimmer = Math.sin(time * 5 + i * .37) > .55;

        for (const offset of [-.95, 0, .95]) {
          const y = centerY + offset;
          const radius = treeRadius(y, angle) + 1.35;
          const color = offset === 0 && shimmer ? gold[2] : gold[1];

          project(Math.cos(angle) * radius, y, Math.sin(angle) * radius,
            offset === 0 && shimmer ? '*' : '+', color);
        }
      }
    }

    function drawOrnaments(time) {
      ornaments.forEach((ball, i) => {
        const size = ball.size * ease((time - 7.5 - i * .13) / .45);
        if (size < .2) return;

        const radius = treeRadius(ball.y, ball.angle) + 1.1;
        const x = Math.cos(ball.angle) * radius;
        const z = Math.sin(ball.angle) * radius;

        for (let dy = -size; dy <= size; dy += .43) {
          for (let dx = -size; dx <= size; dx += .43) {
            const square = size * size - dx * dx - dy * dy;
            if (square < 0) continue;

            const front = Math.sqrt(square);
            const shiny = dx < 0 && dy > 0 && front > size * .55;
            const color = ball.gold
              ? (shiny ? '#fff1ac' : '#d9a044')
              : (shiny ? '#ff90a2' : '#c52e51');

            project(x + dx * turnCos + front * turnSin, ball.y + dy,
              z - dx * turnSin + front * turnCos, shiny ? '*' : 'O', color);
          }
        }
      });
    }

    function drawGift(gift, index, time) {
      const age = time - 9.5 - index * .41;
      if (age <= 0) return;

      const scale = ease(age / .48);
      const lift = 12 * (1 - ease(age / .66));
      const x = Math.cos(gift.angle) * gift.radius;
      const z = Math.sin(gift.angle) * gift.radius;
      const half = gift.size * scale / 2;
      const giftTop = gift.height * scale;

      for (let a = -half; a <= half; a += .45) {
        for (let b = -half; b <= half; b += .45) {
          const ribbon = Math.abs(a) < .75 || Math.abs(b) < .75;
          project(x + a, giftTop + lift, z + b,
            ribbon ? '+' : 'x', ribbon ? gift.ribbon : gift.wrap);
        }
      }

      for (let y = 0; y <= giftTop; y += .45) {
        for (let side = -half; side <= half; side += .45) {
          const ribbon = Math.abs(side) < .75 || giftTop - y < .5;
          const color = ribbon ? gift.ribbon : gift.wrap;
          const mark = ribbon ? '+' : '#';

          for (const edge of [-half, half]) {
            project(x + side, y + lift, z + edge, mark, color);
            project(x + edge, y + lift, z + side, mark, color);
          }
        }
      }

      for (const side of [-1, 1]) {
        for (let angle = 0; angle < tau; angle += .25) {
          const loop = side * (1.2 + Math.cos(angle) * 1.1) * scale;
          const y = (1.2 + Math.sin(angle) * .8) * scale;
          project(x + loop, giftTop + lift + y, z, '*', gift.ribbon);
        }
      }
    }

    function drawStar(time) {
  const scale = ease((time - 11.8) / .7);
  if (scale === 0) return;

  const radius = 7.8 * unit * scale;
  const centerX = width / 2;
  const centerY = baseY - treeHeight * unit - radius * .8;
  const treeTipY = baseY - treeHeight * unit;

for (let y = centerY + radius * .35; y <= treeTipY + rowHeight / 2; y += rowHeight / 2) {
  put(centerX, y, 79, '|', '#e5b34f');
}

  // Dış ve iç köşeler sırayla birleşerek yıldızın beş ucunu oluşturur.
  const points = Array.from({ length: 10 }, (_, i) => {
    const angle = -Math.PI / 2 + i * Math.PI / 5;
    const length = radius * (i % 2 === 0 ? 1 : .41);

    return {
      x: centerX + Math.cos(angle) * length,
      y: centerY + Math.sin(angle) * length
    };
  });

  const firstCol = Math.floor((centerX - radius) / columnWidth);
  const lastCol = Math.floor((centerX + radius) / columnWidth);
  const firstRow = Math.floor((centerY - radius) / rowHeight);
  const lastRow = Math.floor((centerY + radius) / rowHeight);

  for (let row = firstRow; row <= lastRow; row++) {
    for (let col = firstCol; col <= lastCol; col++) {
      const x = (col + .5) * columnWidth;
      const y = (row + .5) * rowHeight;
      let inside = false;

      for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
        const a = points[i];
        const b = points[j];

        if ((a.y > y) !== (b.y > y)) {
          const crossing = a.x + (b.x - a.x) * (y - a.y) / (b.y - a.y);
          if (x < crossing) inside = !inside;
        }
      }

      if (inside) {
        const color = y < centerY ? '#fff1ad' : '#ffd168';
        put(x, y, 80, '*', color);
      }
    }
  }
}

    function render(time) {
      depth.fill(-Infinity);
      marks.fill('');

      const rotation = time * .5;
      turnCos = Math.cos(rotation);
      turnSin = Math.sin(rotation);

      drawSnow(time);
      drawGround();
      drawTree(time, rotation);
      drawLights(time);
      drawOrnaments(time);
      gifts.forEach((gift, index) => drawGift(gift, index, time));
      drawStar(time);

      ctx.fillStyle = '#05080d';
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < marks.length; i++) {
        if (!marks[i]) continue;
        ctx.fillStyle = colors[i];
        ctx.fillText(
          marks[i],
          (i % columns + .5) * columnWidth,
          (Math.floor(i / columns) + .5) * rowHeight
        );
      }

      const greeting = ease((time - 13.1) / .8);
      if (greeting > 0) {
        ctx.globalAlpha = greeting;
        ctx.fillStyle = '#e5b8cb';
        ctx.fillText('M E R R Y   C H R I S T M A S   2 0 2 6',
          width / 2, baseY + unit * 17, width * .9);
        ctx.globalAlpha = 1;
      }
    }

    function restart() {
      start = performance.now();
      lastFrame = -Infinity;
    }

    function animate(now) {
      const still = motion.matches;

      if (lastFrame === -Infinity || (!still && now - lastFrame >= 32)) {
        render(still ? 15 : Math.max(0, (now - start) / 1000));
        lastFrame = now;
      }

      requestAnimationFrame(animate);
    }

    addEventListener('resize', resize);
    addEventListener('keydown', event => {
      if (event.key.toLowerCase() === 'r') restart();
    });
    motion.addEventListener('change', restart);

    resize();
    render(motion.matches ? 15 : 0);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
